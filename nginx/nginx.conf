user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

# ---------- MQTT over TLS для устройств: 8883 (TLS) -> emqx:1883 ----------
stream {
  upstream emqx_mqtt {
    server emqx:1883;
  }

  limit_conn_zone $binary_remote_addr zone=mqtt_per_ip:10m;

  server {
    listen 8883 ssl;
    proxy_pass emqx_mqtt;

    ssl_certificate     /etc/letsencrypt/live/iot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mqtt_ssl:5m;
    ssl_handshake_timeout 15s;

    limit_conn mqtt_per_ip 50;
    proxy_connect_timeout 5s;
    # должно быть больше keepalive устройства * 1.5
    proxy_timeout 10m;
  }
}

# ---------- HTTP(S): API, WebSocket MQTT, статика ----------
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 64k;

  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log main;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend_api {
    server backend:8000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/iot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:web_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # панель: только свои скрипты и стили, живые данные — через свой же wss
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # keepalive к upstream
    proxy_set_header Connection "";

    # Чувствительные эндпоинты — жёсткий лимит
    location ~ ^/api/(auth/login|auth/register|provision)$ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend_api;
    }

    # Загрузка прошивок (до FIRMWARE_MAX_MB) и их скачивание устройствами
    location = /api/firmwares {
      limit_req zone=api burst=10 nodelay;
      client_max_body_size 16m;
      proxy_request_buffering on;
      proxy_pass http://backend_api;
    }
    location /api/ota/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_read_timeout 120s;
      proxy_pass http://backend_api;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend_api;
    }

    # /internal/* НЕ проксируется — хуки EMQX доступны только внутри docker-сети

    # MQTT over WebSocket (для будущей веб-панели).
    # proxy_set_header в location отменяет наследование, поэтому всё объявлено заново.
    location = /mqtt {
      proxy_pass http://emqx:8083;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 10m;
      proxy_send_timeout 10m;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      # обновление файлов панели подхватывается без жёсткой перезагрузки
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
