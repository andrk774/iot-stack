# Локальный брокер домашней сети для zigbee2mqtt и ESPHome.
listener 1883
# Для домашней сети анонимный доступ допустим; если в сети есть чужие устройства —
# задайте пароли: mosquitto_passwd -c /mosquitto/config/passwd user, allow_anonymous false,
# password_file /mosquitto/config/passwd, и укажите EXTERNAL_MQTT_USERNAME/PASSWORD мостам.
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
