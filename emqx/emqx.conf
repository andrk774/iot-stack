## EMQX 5.8 — одиночный узел.
## Аутентификация и ACL делегированы бэкенду по HTTP (внутренний порт 8001),
## аналог emqx_auth_mysql в 2Smart, но логика в одном месте — в коде бэкенда.

node {
  name = "emqx@127.0.0.1"
  ## переопределяется EMQX_NODE__COOKIE из .env
  cookie = "override-me-from-env"
  data_dir = "data"
}

cluster {
  name = iot
  discovery_strategy = manual
}

log.console.level = warning

dashboard.listeners.http.bind = 18083

## Ключ REST API для бэкенда (разрыв сессий при отзыве доступа).
## Файл пишет setup.sh из EMQX_API_KEY/EMQX_API_SECRET; EMQX перечитывает его при каждом старте.
api_key {
  bootstrap_file = "/opt/emqx/etc/api_keys.conf"
}

## Внутри docker-сети — без TLS. Наружу MQTT выходит только через nginx:8883 (TLS).
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
}

## WebSocket для веб-панели (wss://<host>/mqtt через nginx)
listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 10000
  websocket.mqtt_path = "/mqtt"
}

listeners.ssl.default.enable = false
listeners.wss.default.enable = false

mqtt {
  max_packet_size = 64KB
  max_clientid_len = 64
  max_topic_levels = 8
  idle_timeout = 15s
}

retainer {
  enable = true
  max_payload_size = 8KB
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://backend:8001/internal/mqtt/auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    headers {
      "content-type" = "application/json"
    }
    connect_timeout = 5s
    request_timeout = 5s
    pool_size = 8
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
    max_size = 64
    ttl = 5m
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://backend:8001/internal/mqtt/acl"
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "content-type" = "application/json"
      }
      request_timeout = 5s
    }
  ]
}
